<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Honiver - Category</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
<style>
    .nav-login-btn {
  background: transparent !important;
  border: 1.5px solid var(--blue) !important;
  color: var(--blue) !important;
}
.nav-login-btn:hover {
  background: var(--blue) !important;
  color: #fff !important;
}
  body { background: #F4F7FF; }
  /* Override nav to always be solid */
  nav { background: #fff; box-shadow: 0 1px 0 var(--bdr); position: sticky; }
  nav .n-logo { color: var(--navy); }
  nav .n-links a { color: var(--muted); }
  nav .n-links a:hover { color: var(--navy); }
  nav .n-ham span { background: var(--navy); }
  
  /* Category Page Layout */
  .cat-page { display: flex; max-width: 1300px; margin: 40px auto; padding: 0 5%; gap: 40px; align-items: flex-start; }
  
  /* Sidebar */
  .sidebar { width: 240px; flex-shrink: 0; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--bdr); }
  .sb-title { font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--navy); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .sb-title::before { content: ''; display: block; width: 4px; height: 14px; background: var(--blue); border-radius: 2px; }
  .sb-list { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-bottom: 30px; }
  .sb-list a { display: block; padding: 8px 12px; border-radius: 6px; font-size: .9rem; color: var(--muted); text-decoration: none; transition: background .2s, color .2s; }
  .sb-list a:hover { background: var(--off); color: var(--navy); }
  .sb-list a.active { background: var(--blue); color: #fff; font-weight: 500; }
  
  /* Main Content */
  .main-content { flex: 1; }
  
  /* Top Bar */
  .top-bar { background: #fff; border-radius: 12px; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid var(--bdr); }
  .tb-title { font-family: var(--f-display); font-size: 2rem; color: var(--navy); letter-spacing: .02em; }
  .tb-sort { display: flex; align-items: center; gap: 12px; font-size: .85rem; color: var(--muted); }
  .sort-btn { padding: 8px 16px; border: 1px solid var(--bdr); background: #fff; border-radius: 6px; cursor: pointer; transition: all .2s; color: var(--navy); }
  .sort-btn:hover { border-color: var(--blue); }
  .sort-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  
  /* Grid */
  .cg { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  
  /* Book Card */
  .c-bk { background: #fff; border-radius: 12px; border: 1px solid var(--bdr); padding: 16px; text-decoration: none; display: block; transition: transform .3s, box-shadow .3s; }
  .c-bk:hover { transform: translateY(-5px); box-shadow: 0 12px 30px rgba(0,0,0,0.06); border-color: rgba(24,83,227,.3); }
  .cb-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; margin-bottom: 16px; background: #eee; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .cb-cat { font-size: .6rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; color: var(--blue); margin-bottom: 6px; }
  .cb-ttl { font-family: var(--f-display); font-size: 1.2rem; color: var(--navy); line-height: 1.1; margin-bottom: 4px; }
  .cb-auth { font-family: var(--f-serif); font-style: italic; font-size: .85rem; color: var(--muted); margin-bottom: 12px; }
  .cb-pr-row { display: flex; align-items: center; justify-content: space-between; }
  .cb-pr { font-size: 1.1rem; font-weight: 600; color: #ee4d2d; } /* Shopee Orange */
  .cb-sold { font-size: .75rem; color: var(--muted); }
  
  @media(max-width: 900px) {
    .cat-page { flex-direction: column; }
    .sidebar { width: 100%; }
    .top-bar { flex-direction: column; gap: 16px; align-items: flex-start; }
  }
</style>
</head>
<body>
<!-- NAV -->
<nav id="nav">
  <a href="index.html" class="n-logo"><span class="n-pip"></span>HONIVER</a>
  <div class="n-search" style="display:flex; align-items:center; background:#f0f2f5; border-radius:20px; padding:6px 16px; margin:0 20px; flex:1; max-width:400px;">
    <span style="font-size:14px; opacity:0.5; margin-right:8px;">🔍</span>
    <input type="text" id="searchInput" placeholder="Search books by title or author..." autocomplete="off" style="border:none; background:transparent; outline:none; font-family:var(--f-body); font-size:0.85rem; width:100%; color:var(--navy);" onkeypress="if(event.key==='Enter') window.location.href='category.html?search='+this.value">
    <div class="search-res" id="search-res"></div>
  </div>
  <ul class="n-links">
  <li><a href="index.html">Home</a></li>
  <li><a href="category.html?cat=all">Categories</a></li>
  <li><a href="#" class="n-cta nav-login-btn" onclick="openLoginModal(event)">Login</a></li>
</ul>
</nav>

<div class="cat-page">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sb-title">Categories</div>
    <ul class="sb-list" id="cat-list">
      <li><a href="category.html?cat=all" data-id="all">All Books</a></li>
      <li><a href="category.html?cat=business" data-id="business">Business & Finance</a></li>
      <li><a href="category.html?cat=self-help" data-id="self-help">Self-help & Growth</a></li>
      <li><a href="category.html?cat=literature" data-id="literature">Literature & Fiction</a></li>
      <li><a href="category.html?cat=skills" data-id="skills">Skills & Wellness</a></li>
    </ul>
    
    <div class="sb-title" style="margin-top:30px">Rating</div>
    <ul class="sb-list">
      <li><a href="#">⭐⭐⭐⭐⭐ (5.0)</a></li>
      <li><a href="#">⭐⭐⭐⭐ & Up</a></li>
    </ul>
  </aside>
  
  <!-- MAIN -->
  <main class="main-content">
    <div class="top-bar">
      <div class="tb-title" id="page-title">ALL BOOKS</div>
      <div class="tb-sort">
        Sort by:
        <button class="sort-btn active" onclick="sortBooks('all', this)">All</button>
        <button class="sort-btn" onclick="sortBooks('pop', this)">Popular</button>
        <button class="sort-btn" onclick="sortBooks('new', this)">Latest</button>
        <button class="sort-btn" onclick="sortBooks('price', this)">Price</button>
      </div>
    </div>
    
    <div class="cg" id="book-grid">
      <!-- Generated by JS -->
    </div>
  </main>
</div>

<script src="books.js?v=6"></script>
<script>
  // Add formatVND function in case it's not in books.js
  function formatVND(n) { return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(n); }

  // Get category/search from URL
  const urlParams = new URLSearchParams(window.location.search);
  const currentCat = urlParams.get('cat') || 'all';
  const searchQuery = urlParams.get('search') ? urlParams.get('search').toLowerCase() : '';
  
  // Highlight sidebar
  document.querySelectorAll('#cat-list a').forEach(a => {
    if (a.dataset.id === currentCat && !searchQuery) a.classList.add('active');
  });
  
  // Update title
  const titles = {
    'all': 'All Books',
    'business': 'Business & Finance',
    'self-help': 'Self-help & Growth',
    'literature': 'Literature & Fiction',
    'skills': 'Skills & Wellness'
  };
  
  if (searchQuery) {
    document.getElementById('page-title').textContent = 'Search: "' + searchQuery + '"';
  } else {
    document.getElementById('page-title').textContent = titles[currentCat] || 'Books';
  }
  
  // Filter and render books
  let currentBooks = booksData.filter(b => {
    let matchCat = (currentCat === 'all' || b.cat === currentCat);
    let matchSearch = true;
    if (searchQuery) {
      matchSearch = b.title.toLowerCase().includes(searchQuery) || b.author.toLowerCase().includes(searchQuery);
    }
    return matchCat && matchSearch;
  });
  
  const grid = document.getElementById('book-grid');
  
  function renderBooks() {
    grid.innerHTML = '';
    currentBooks.forEach(b => {
      grid.innerHTML += `
        <a href="product.html?id=${b.id}" class="c-bk">
          <img src="${b.cover}" class="cb-img" alt="${b.title}">
          <div class="cb-cat">${b.catLabel}</div>
          <div class="cb-ttl">${b.title}</div>
          <div class="cb-auth">${b.author}</div>
          <div class="cb-pr-row">
            <span class="cb-pr">${formatVND(b.price)}</span>
            <span class="cb-sold">${b.sold > 1000 ? (b.sold/1000).toFixed(1) + 'k' : b.sold} sold</span>
          </div>
        </a>
      `;
    });
  }
  
  function sortBooks(type, btnElement) {
    // 1. Xử lý đổi màu nút (An toàn, không bị lỗi khi tự động chạy lúc load trang)
    document.querySelectorAll('.sort-btn').forEach(btn => btn.classList.remove('active'));
    if (btnElement) {
      btnElement.classList.add('active');
    } else {
      // Dành cho lúc mới load trang (không có click chuột)
      const defaultBtn = document.querySelector(`.sort-btn[onclick*="${type}"]`);
      if (defaultBtn) defaultBtn.classList.add('active');
    }
    
    // 2. Refresh lại danh sách gốc để hủy bỏ các bộ lọc cũ
    currentBooks = booksData.filter(b => {
      let matchCat = (currentCat === 'all' || b.cat === currentCat);
      let matchSearch = true;
      if (searchQuery) {
        matchSearch = b.title.toLowerCase().includes(searchQuery) || b.author.toLowerCase().includes(searchQuery);
      }
      return matchCat && matchSearch;
    });
    
    // 3. Tiến hành phân loại (Nếu là 'all' thì giữ nguyên mảng gốc)
    if (type === 'pop') currentBooks.sort((a,b) => b.sold - a.sold);
    if (type === 'new') currentBooks.sort((a,b) => b.rating - a.rating);
    if (type === 'price') currentBooks.sort((a,b) => a.price - b.price);
    
    // 4. In sách ra màn hình
    renderBooks();
  }
  
  // Khởi động trang: Mặc định chọn hiển thị 'All' (Tất cả) 
  sortBooks('all');
</script>
</body>
</html>
